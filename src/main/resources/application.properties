# ==========================================
# RAZORPAY / PAYMENT GATEWAY CONFIGURATION
# ==========================================
#
# CURRENT MODE: sandbox (safe default — no real money moves)
#
# ── How to switch to PRODUCTION (Live) ───────────────────────────────────────
# Set the following environment variables on your server / deployment platform:
#
#   RAZORPAY_KEY_ID      = rzp_live_xxxxxxxxxxxx   (from Razorpay Dashboard → API Keys)
#   RAZORPAY_KEY_SECRET  = <your live key secret>
#   RAZORPAY_WEBHOOK_SECRET = <webhook signing secret set in Razorpay Dashboard>
#   PAYMENT_GATEWAY_VPA  = <your ICICI / bank VPA registered as a verified Merchant VPA>
#   PAYMENT_GATEWAY_MERCHANT_NAME = Anusha Porter Logistics Private Limited
#   PAYMENT_GATEWAY_PROVIDER = razorpay
#
# When RAZORPAY_KEY_ID is set to a real "rzp_live_..." key, the backend automatically:
#   1. Creates an official Razorpay Order via /v1/orders
#   2. Generates a Razorpay QR Code via /v1/payments/qr_codes (NPCI-compliant, signed)
#   3. Sets gateway = "razorpay" in all payment records
#   4. Webhook signature verification uses RAZORPAY_WEBHOOK_SECRET (HMAC-SHA256)
#
# ─────────────────────────────────────────────────────────────────────────────
# ⚠️  UPI PAYMENT VPA — MUST BE SET TO REAL AU SMALL FINANCE BANK VPA
# ─────────────────────────────────────────────────────────────────────────────
# Business bank: AU Small Finance Bank  →  UPI handle: @aubank
#
# ❌ "anushaporter@icici" is WRONG — business has no ICICI account
# ✅ Correct VPA format: anushaporter@aubank
#
# HOW TO REGISTER anushaporter@aubank:
#   1. Open "AU 0101" app (AU Bank official app)
#   2. UPI → My UPI IDs → + Create New UPI ID
#   3. Type: anushaporter  →  handle @aubank auto-selected
#   4. Test: send ₹1 from PhonePe to anushaporter@aubank
#   5. If success → set below and restart, or call:
#      POST /api/settings { "MERCHANT_VPA": "anushaporter@aubank" }
#
# ✅ Option A — Set environment variable on server (no redeploy needed):
#    PAYMENT_GATEWAY_VPA=anushaporter@aubank
#
# ✅ Option B — Hot-update via Admin API (instant, no restart):
#    POST https://api.anushaporter.com/api/settings
#    { "MERCHANT_VPA": "anushaporter@aubank" }
# ─────────────────────────────────────────────────────────────────────────────
