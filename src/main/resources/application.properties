server.port=${SERVER_PORT:8090}
server.address=0.0.0.0

# ==========================================
# DATABASE CONFIGURATION - AWS RDS MYSQL
# ==========================================

spring.datasource.url=${RDS_URL}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${RDS_USERNAME}
spring.datasource.password=${RDS_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# H2 disabled for production
spring.h2.console.enabled=false


# ==========================================
# AWS S3 CONFIGURATION
# ==========================================

aws.s3.bucket.name=${S3_BUCKET_NAME:anusha-porter-app-images}


# ==========================================
# CORS
# ==========================================

spring.web.cors.allowed-origins=*


# ==========================================
# EMAIL CONFIGURATION
# ==========================================

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true


# ==========================================
# GOOGLE MAPS
# ==========================================

google.maps.api.key=${GOOGLE_MAPS_API_KEY}


# ==========================================
# FILE UPLOAD SETTINGS
# ==========================================

file.upload-dir=${FILE_UPLOAD_DIR:uploads/}

spring.servlet.multipart.enabled=true

# Max file/document upload = 10 MB
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# Use disk-based temp storage for large uploads
spring.servlet.multipart.file-size-threshold=2MB


# ==========================================
# SSL CONFIGURATION
# ==========================================

server.ssl.enabled=${ENABLE_SSL:false}
server.ssl.key-store=classpath:keystore.p12
server.ssl.key-store-password=${SSL_KEYSTORE_PASSWORD:password}
server.ssl.key-store-type=pkcs12


# ==========================================
# RAZORPAY / PAYMENT GATEWAY
# ==========================================

payment.gateway.vpa=${PAYMENT_GATEWAY_VPA:anushabazaar1670@aubank}

payment.gateway.merchant_name=${PAYMENT_GATEWAY_MERCHANT_NAME:Anusha Porter Logistics}

payment.gateway.provider=${PAYMENT_GATEWAY_PROVIDER:razorpay}