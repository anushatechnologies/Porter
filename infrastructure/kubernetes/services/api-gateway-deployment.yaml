apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: porter-prod
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: 123456789012.dkr.ecr.ap-south-1.amazonaws.com/api-gateway:latest
          ports:
            - containerPort: 8080

