version: '3.8'

services:
  api-gateway:
    build:
      context: ./services/api-gateway
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
    networks:
      - porter-network

  customer-app:
    build:
      context: ./frontend/customer-app
      dockerfile: Dockerfile
    ports:
      - "3001:3000"
    networks:
      - porter-network

networks:
  porter-network:
    driver: bridge
